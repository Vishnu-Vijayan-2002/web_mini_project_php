<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/payment.css">
</head>
<body>

<div class="payment-form">
  <h2>Donations</h2>
  <form id="fakePaymentForm">
    <div class="mb-3">
      <label for="amount" class="form-label">Donation Amount (₹)</label>
      <input type="number" class="form-control" id="amount" required min="1" placeholder="Enter amount">
    </div>
    <div class="mb-3">
      <label for="cardName" class="form-label">Name on Card</label>
      <input type="text" class="form-control" id="cardName" required>
    </div>
    <div class="mb-3">
      <label for="cardNumber" class="form-label">Card Number</label>
      <input type="text" class="form-control" id="cardNumber" required>
    </div>
    <div class="mb-3 row">
      <div class="col">
        <label for="expiry" class="form-label">Expiry</label>
        <input type="text" class="form-control" id="expiry" placeholder="MM/YY" required>
      </div>
      <div class="col">
        <label for="cvv" class="form-label">CVV</label>
        <input type="password" class="form-control" id="cvv" required>
      </div>
    </div>
    <button type="submit" class="btn btn-success w-100" id="payBtn">Pay</button>
  </form>
</div>

<script src="js/payment.js"></script>
</body>
</html>
